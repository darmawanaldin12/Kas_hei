<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas Kantor — offline</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#86BFFF;font-family:system-ui,sans-serif;color:#1A1A2E}
.box{max-width:320px;margin:24px;padding:24px;background:#fff;border:3px solid #1A1A2E;border-radius:24px;box-shadow:6px 6px 0 #1A1A2E}
h1{margin:0 0 8px;font-size:28px;font-weight:800}
p{margin:0 0 16px;line-height:1.4}
button{min-height:48px;padding:0 24px;border:3px solid #1A1A2E;border-radius:999px;background:#7DF0C0;box-shadow:4px 4px 0 #1A1A2E;font-size:16px;font-weight:800;color:#1A1A2E;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>Offline</h1>
<p>Tidak ada koneksi internet. Data kas hanya bisa dilihat saat online.</p>
<button onclick="location.reload()">Coba lagi</button>
</div>
</body>
</html>
